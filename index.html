  function renderProjects(filter = 'all', query = '') {
    const grid = document.getElementById('projectsGrid');
    const filtered = projects.filter(p => {
      const matchesFilter = 
        filter === 'all' ? true :
        filter === 'live' ? p.isLive :
        p.category === filter;
      
      const searchStr = `${p.name} ${p.title} ${p.desc}`.toLowerCase();
      const matchesQuery = query === '' || searchStr.includes(query.toLowerCase());

      return matchesFilter && matchesQuery;
    });

    // Update Stats
    document.getElementById('statTotal').innerText = projects.length;
    document.getElementById('statLive').innerText = projects.filter(p => p.isLive).length;

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state">검색 결과가 없습니다. 다른 키워드로 검색해보세요.</div>`;
      return;
    }

    grid.innerHTML = filtered.map(p => `
      <div class="project-card">
        <div>
          <div class="project-card-header">
            <h3 class="project-title">${p.title}${p.isPrivate ? ' <span title="비공개 저장소">🔒</span>' : ''}</h3>
            ${p.isLive ? '<span class="tag-badge tag-live">🚀 Live</span>' : '<span class="tag-badge tag-github">⭐ Repo</span>'}
          </div>
          <span class="project-category">${getCategoryName(p.category)}</span>
          <p class="project-desc">${p.desc}</p>
        </div>
        <div class="project-actions">
          ${p.isLive && p.liveUrl ? `<a href="${p.liveUrl}" target="_blank" class="action-link link-live">🌐 웹앱 접속</a>` : ''}
          ${p.githubUrl ? `<a href="${p.githubUrl}" target="_blank" class="action-link link-github">🐙 GitHub</a>` : ''}
        </div>
      </div>
    `).join('');
  }

  function getCategoryName(cat) {
    switch(cat) {
      case 'pe': return '🏀 체육 & 스포츠';
      case 'guide': return '📚 AI & 개발 가이드';
      case 'tool': return '🛠️ 툴 & 유틸리티';
      default: return '📁 일반';
    }
  }

  // Event Listeners
  document.getElementById('searchInput').addEventListener('input', (e) => {
    const activeFilter = document.querySelector('.tab-btn.active').dataset.filter;
    renderProjects(activeFilter, e.target.value.trim());
  });

  document.getElementById('filterTabs').addEventListener('click', (e) => {
    if (e.target.classList.contains('tab-btn')) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      const query = document.getElementById('searchInput').value.trim();
      renderProjects(e.target.dataset.filter, query);
    }
  });

  // Initial Render
  renderProjects();
</script>
